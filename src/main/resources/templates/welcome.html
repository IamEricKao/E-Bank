<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f6f9fc; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 30px auto; background: #ffffff; border-radius: 8px;
            padding: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        h2 { color: #1565c0; }
        p { color: #333; }
        .footer { margin-top: 30px; font-size: 13px; color: #555; }
    </style>
</head>
<body>
<div class="container">
    <h2>歡迎您， <span th:text="${name}"></span>!</h2>
    <p> 我們非常高興您能加入 <b>eBank</b>。</p>
    <p>即刻起，您可全面享受便捷的存款、提款、轉帳及月結單服務。</p>
    <p><b>理財新起點，由此開始。 🚀</b></p>
    <div class="footer">
        © 2026 eBank | 您的數位銀行夥伴
    </div>
</div>
</body>
</html>
