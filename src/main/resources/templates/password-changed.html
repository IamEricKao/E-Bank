<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>密碼修改通知</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f6f9fc;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
            background: #ffffff;
            border-radius: 8px;
            padding: 25px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        h2 {
            color: #1565c0;
        }

        p {
            color: #333;
        }

        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #555;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>密碼修改成功</h2>
    <p>嗨! <span th:text="${name}"></span>,</p>
    <p>您的密碼已經修改成功。</p>
    <p>如果你沒有進行此操作，請立即 <b>重設你的密碼</b> 並聯繫我們的技術支援團隊。
    </p>
    <div class="footer">© 2026 eBank | 安全第一</div>
</div>
</body>
</html>
